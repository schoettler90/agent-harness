[project]
name = "agent-harness"
version = "0.1.0"
description = "Provider-agnostic agent harness with FastAPI, LiteLLM, and pluggable tools"
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.5",
    "fastapi[standard]>=0.136.1",
    "google-api-python-client>=2.195.0",
    "google-auth>=2.50.0",
    "litellm>=1.84.0rc1",
    "loguru>=0.7.3",
    "openai-agents>=0.15.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.15.12",
    "pytest-asyncio>=1.3.0",
]
